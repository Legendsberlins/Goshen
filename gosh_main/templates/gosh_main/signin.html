{% extends 'gosh_main/base.html' %}

{% block title %}Sign In{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <h2>Sign in to your account</h2>
    {% if message %}
      <div class="alert{% if message_success %} alert-success{% endif %}">{{ message }}</div>
    {% endif %}

    <form method="post" action="{% url 'gosh_main:login' %}" class="email-signin">
      {% csrf_token %}
      <label for="username">Email or Username</label>
      <input id="username" name="username" type="text" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <button type="submit" class="btn-primary-large">Sign In</button>
    </form>

    <p class="small"><a href="{% url 'gosh_main:password_reset_request' %}">Forgot your password?</a></p>

    <p class="small">Don't have an account? <a href="{% url 'gosh_main:register' %}">Sign up</a></p>
  </div>
</section>
{% endblock %}
